<style>
  :root{ --navy:#003575; --navy-dark:#00224d; --blue:#3c62ac; --amber:#f0a500; --ink:#334155; --muted:#62646e; --line:#d9dbe0; --bad:#a3261c; --bad-bg:#f8e3e0;
    --font:"Helvetica Neue","Hanken Grotesk",Helvetica,Arial,sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; font:400 16px/1.6 var(--font); background:#f2f2f2; color:var(--ink); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  header{ background:#fff; border-bottom:1px solid var(--line); }
  .brand-row{ max-width:1400px; margin:0 auto; padding:8px 24px; min-height:72px; display:flex; align-items:center; gap:18px; }
  .brand-row img{ height:40px; width:auto; display:block; }
  .brand-divider{ width:1px; height:34px; background:var(--line); }
  .brand-name{ font:300 18px/1.1 var(--font); letter-spacing:.12em; text-transform:uppercase; color:var(--blue); }
  .brand-name strong{ font-weight:700; color:var(--navy); }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%); }
  .tarjeta{ width:100%; max-width:400px; background:#fff; border-top:3px solid var(--amber); padding:32px 32px 28px; }
  .etiqueta{ font:600 11px/1.3 var(--font); letter-spacing:.14em; text-transform:uppercase; color:var(--blue); margin:0 0 6px; }
  h1{ font:300 26px/1.2 var(--font); color:var(--navy); margin:0 0 6px; }
  h1 strong{ font-weight:700; }
  .bajada{ font-size:14px; color:var(--muted); margin:0 0 22px; }
  label.mantener{ display:flex; align-items:center; gap:8px; margin:16px 0 0; font:400 14px/1.3 var(--font); letter-spacing:0; text-transform:none; color:var(--ink); cursor:pointer; }
  label.mantener input{ width:16px; height:16px; margin:0; padding:0; }
  label{ display:block; font:600 11px/1.3 var(--font); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  input{ width:100%; padding:11px 12px; font:400 16px/1.3 var(--font); color:var(--ink); border:1px solid #b9c0cc; border-radius:2px; background:#fff; }
  button{ width:100%; margin-top:22px; padding:12px; font:600 13px/1 var(--font); letter-spacing:.1em; text-transform:uppercase; color:#fff; background:var(--navy); border:0; border-radius:2px; cursor:pointer; }
  button:hover{ background:var(--navy-dark); }
  button:disabled{ opacity:.6; cursor:default; }
  .aviso{ display:none; margin-top:16px; padding:10px 12px; font-size:14px; color:var(--bad); background:var(--bad-bg); border-left:3px solid var(--bad); }
  .prueba{ margin:0 0 16px; padding:8px 10px; font-size:12.5px; color:#9a5b00; background:#fdf1d8; border-left:3px solid var(--amber); }
  .abriendo{ display:none; flex:1; align-items:center; justify-content:center; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  html.con-sesion main, html.con-sesion footer{ display:none; }
  html.con-sesion .abriendo{ display:flex; }
  footer{ background:#fff; border-top:1px solid var(--line); text-align:center; padding:10px 24px; font-size:7.5px; color:var(--muted); letter-spacing:.06em; }
  @media (max-width:560px){ .brand-row img{ height:30px; } .brand-name{ font-size:14px; } .tarjeta{ padding:24px 20px; } }
</style>
</head>

  </form>

<script>
// Cliente de acceso (navegador). Lo incrustan la pantalla de ingreso de las
// paginas protegidas (plantilla-acceso.html) y la pagina de administracion
// (plantilla-admin.html). Habla con Supabase por su API REST, sin librerias.
// El supervisor escribe solo "usuario" y clave: por dentro el usuario es el
// correo ficticio usuario@DOMINIO, porque Supabase exige un correo.
const Acceso = (() => {
  const CLAVE_SESION = 'portal_sesion';
  const CLAVE_USUARIO = 'portal_usuario';   // ultimo usuario que entro en este navegador (nunca la clave)
  const CLAVE_MANTENER = 'portal_mantener'; // '1' si marco "Mantener la sesion iniciada"
  const DURACION_MS = 12 * 60 * 60 * 1000;  // pasado este tiempo se pide la clave de nuevo
  const DURACION_LARGA_MS = 30 * 24 * 60 * 60 * 1000; // si marco "Mantener la sesion iniciada"
  let cfg = { url: '', key: '', dominio: 'portal.local' };

  function configurar(c) { cfg = Object.assign(cfg, c); }

  async function pedir(metodo, ruta, cuerpo, token) {
    const headers = { apikey: cfg.key };
    if (token) headers.Authorization = 'Bearer ' + token;
    if (cuerpo !== undefined) headers['Content-Type'] = 'application/json';
    const r = await fetch(cfg.url + ruta, { method: metodo, headers, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo) });
    let datos = null;
    try { datos = await r.json(); } catch (e) { /* respuesta sin cuerpo */ }
    return { ok: r.ok, estado: r.status, datos };
  }

  function leerSesion() {
    try {
      const s = JSON.parse(localStorage.getItem(CLAVE_SESION));
      if (s && s.rt && Date.now() - s.desde < (s.dura || DURACION_MS)) return s;
    } catch (e) { /* sin sesion */ }
    salir();
    return null;
  }
  // d = respuesta de Supabase Auth. El token de acceso se guarda con su
  // vencimiento para reutilizarlo al pasar de una pagina a otra.
  function guardarSesion(d, desde, dura) {
    const sesion = { rt: d.refresh_token, desde, dura, at: d.access_token, vence: Date.now() + (d.expires_in || 3600) * 1000 };
    try { localStorage.setItem(CLAVE_SESION, JSON.stringify(sesion)); } catch (e) { /* modo privado */ }
  }
  function haySesion() { return !!leerSesion(); }
  function ultimoUsuario() { try { return localStorage.getItem(CLAVE_USUARIO) || ''; } catch (e) { return ''; } }
  function salir() {
    try { localStorage.removeItem(CLAVE_SESION); } catch (e) { /* nada que borrar */ }
  }

  function normalizarUsuario(u) { return String(u || '').trim().toLowerCase(); }

  // Devuelve el token de acceso, o null si usuario o clave no corresponden.
  // Con mantener = true la sesion dura 30 dias en este navegador en vez de 12 horas.
  async function entrar(usuario, clave, mantener) {
    const r = await pedir('POST', '/auth/v1/token?grant_type=password', { email: normalizarUsuario(usuario) + '@' + cfg.dominio, password: clave });
    if (!r.ok) {
      if (r.estado === 400 || r.estado === 401 || r.estado === 422) return null;
      throw new Error('El servicio de acceso respondió ' + r.estado);
    }
    if (mantener === undefined) mantener = quiereMantener();
    recordarMantener(mantener);
    guardarSesion(r.datos, Date.now(), mantener ? DURACION_LARGA_MS : DURACION_MS);
    try { localStorage.setItem(CLAVE_USUARIO, normalizarUsuario(usuario)); } catch (e) { /* modo privado */ }
    return r.datos.access_token;
  }

  // Retoma la sesion guardada en este navegador (si no ha vencido).
  // Con renovar = true pide un token nuevo aunque el guardado no haya vencido.
  async function retomar(renovar) {
    const s = leerSesion();
    if (!s) return null;
    if (!renovar && s.at && Date.now() < s.vence - 60000) return s.at;
    const r = await pedir('POST', '/auth/v1/token?grant_type=refresh_token', { refresh_token: s.rt });
    if (!r.ok) {
      // Otra pestana pudo renovar al mismo tiempo: si ya dejo un token nuevo, se usa ese.
      const otra = leerSesion();
      if (otra && otra.rt !== s.rt && otra.at && Date.now() < otra.vence - 60000) return otra.at;
      // Solo se cierra la sesion si Supabase la rechaza; una caida de red o del
      // servicio no debe obligar a escribir la clave otra vez.
      if (r.estado === 400 || r.estado === 401 || r.estado === 403) { salir(); return null; }
      throw new Error('El servicio de acceso respondió ' + r.estado);
    }
    guardarSesion(r.datos, s.desde, s.dura);
    return r.datos.access_token;
  }

  // Si la persona eligio "Mantener la sesion iniciada", se recuerda para la proxima vez.
  function quiereMantener() { try { return localStorage.getItem(CLAVE_MANTENER) === '1'; } catch (e) { return false; } }
  function recordarMantener(si) { try { localStorage.setItem(CLAVE_MANTENER, si ? '1' : '0'); } catch (e) { /* modo privado */ } }

  function rpc(nombre, args, token) { return pedir('POST', '/rest/v1/rpc/' + nombre, args, token); }
  function leer(ruta, token) { return pedir('GET', '/rest/v1/' + ruta, undefined, token); }
  function funcion(nombre, cuerpo, token) { return pedir('POST', '/functions/v1/' + nombre, cuerpo, token); }

  // Pantalla para definir una clave propia (clave provisoria). Se resuelve
  // cuando Supabase acepta la clave nueva.
  function pedirClaveNueva(token) {
    return new Promise((listo) => {
      const capa = document.createElement('div');
      capa.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#003575,#00224d);font-family:Helvetica,Arial,sans-serif;';
      const campo = 'width:100%;padding:11px 12px;font-size:16px;border:1px solid #b9c0cc;border-radius:2px;box-sizing:border-box;';
      const rotulo = 'display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#62646e;margin:14px 0 6px;';
      capa.innerHTML = '<form style="width:100%;max-width:400px;background:#fff;border-top:3px solid #f0a500;padding:28px;box-sizing:border-box;">'
        + '<p style="margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3c62ac;">Primer ingreso</p>'
        + '<h1 style="margin:0 0 6px;font-size:24px;font-weight:300;color:#003575;">Define tu <strong>clave</strong></h1>'
        + '<p style="margin:0 0 8px;font-size:14px;color:#62646e;line-height:1.5;">La clave que te entregaron es provisoria. Elige una propia de 8 caracteres o más, distinta de la actual.</p>'
        + '<label style="' + rotulo + '">Clave nueva</label><input type="password" autocomplete="new-password" minlength="8" required style="' + campo + '">'
        + '<label style="' + rotulo + '">Repite la clave nueva</label><input type="password" autocomplete="new-password" minlength="8" required style="' + campo + '">'
        + '<button type="submit" style="width:100%;margin-top:22px;padding:12px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#003575;border:0;border-radius:2px;cursor:pointer;">Guardar clave</button>'
        + '<div role="alert" style="display:none;margin-top:16px;padding:10px 12px;font-size:14px;color:#a3261c;background:#f8e3e0;border-left:3px solid #a3261c;"></div></form>';
      document.body.appendChild(capa);
      const form = capa.querySelector('form'), campos = capa.querySelectorAll('input'), aviso = capa.querySelector('[role=alert]'), boton = capa.querySelector('button');
      const avisar = (t) => { aviso.textContent = t; aviso.style.display = t ? 'block' : 'none'; };
      campos[0].focus();
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (campos[0].value !== campos[1].value) { avisar('Las dos claves no coinciden.'); return; }
        boton.disabled = true;
        try {
          const r = await rpc('cambiar_clave', { p_nueva: campos[0].value }, token);
          if (r.ok && r.datos && r.datos.ok) { capa.remove(); listo(); return; }
          const motivo = r.datos && r.datos.motivo;
          avisar(motivo === 'igual' ? 'La clave nueva debe ser distinta de la que te entregaron.'
            : motivo === 'corta' ? 'La clave debe tener 8 caracteres o más.'
            : 'No se pudo guardar la clave (' + (motivo || r.estado) + ').');
        } catch (err) { avisar('No se pudo guardar la clave. Revisa tu conexión.'); }
        boton.disabled = false;
      });
    });
  }

  return { quiereMantener, pedirClaveNueva, configurar, entrar, retomar, haySesion, ultimoUsuario, salir, rpc, leer, funcion, normalizarUsuario };
})();

<script>
// La pagina real viaja cifrada (AES-256-GCM) en #datosCifrados. La llave no
// esta aca: la entrega la funcion "ingresar" de Supabase, que antes valida al
// usuario y anota el ingreso. LLAVE_PRUEBA solo existe en las paginas prueba_*.
const CFG = { pagina: 'vecino', kid: 'df93d2e4363304ed', iv: 'oC8965i1H7LkImJQ', url: 'https://puqexeqjnhsxyibyehdw.supabase.co', key: 'sb_publishable_0tGCVfVqnfeNQ_IYyHMwJg_ELlJBoUF', dominio: 'portal.local', llavePrueba: '' };
Acceso.configurar({ url: CFG.url, key: CFG.key, dominio: CFG.dominio });

const form = document.getElementById('formIngreso');
const aviso = document.getElementById('aviso');
const boton = document.getElementById('btnEntrar');
// Se recuerda el usuario (no la clave): queda escrito y el cursor pasa a la clave.
if (Acceso.ultimoUsuario()) {
  document.getElementById('usuario').value = Acceso.ultimoUsuario();
  document.getElementById('clave').focus();
}
// "Mantener la sesion iniciada" queda marcado si la persona lo eligio la vez anterior.
document.getElementById('mantener').checked = Acceso.quiereMantener();

function avisar(texto) { aviso.textContent = texto; aviso.style.display = texto ? 'block' : 'none'; }
function ocupado(si) { boton.disabled = si; boton.textContent = si ? 'Ingresando…' : 'Ingresar'; }
function bytes(b64) { return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); }
function escapar(s) { return String(s).replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';'); }

async function abrirPagina(llave, nombre, rol) {
  const k = await crypto.subtle.importKey('raw', bytes(llave), 'AES-GCM', false, ['decrypt']);
  const cifrado = bytes(document.getElementById('datosCifrados').textContent.trim());
  const comprimido = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(CFG.iv) }, k, cifrado);
  let html = await new Response(new Blob([comprimido]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  // Va dentro de la cabecera de la pagina (que queda pegada arriba), a la
  // derecha y despues de "Volver al dashboard" para no taparlo. Si la pagina
  // no tiene cabecera, queda flotando arriba a la derecha.
  const barra = '<div id="barraSesion" style="position:fixed;right:24px;top:20px;z-index:9999;flex:none;white-space:nowrap;padding:6px 12px;background:#fff;border:1px solid #d9dbe0;border-radius:2px;font:12px Helvetica,Arial,sans-serif;color:#62646e;" class="no-imprimir barra-sesion">'
    + (rol === 'admin' ? '<a href="admin.html" style="color:#003575;font-weight:600;">Administración</a> &middot; '
      : rol ? '<a href="admin.html#tecnicos" style="color:#003575;font-weight:600;">Uso de App</a> &middot; ' : '')
    + '<span class="barra-sesion-nombre">' + escapar(nombre) + ' &middot; </span><a href="#" style="color:#003575;font-weight:600;" onclick="try{localStorage.removeItem(\'portal_sesion\')}catch(e){};location.reload();return false;">Cerrar sesión</a></div>'
    + '<script>(function(){var b=document.getElementById("barraSesion"),f=document.querySelector("header .brand-row");'
    + 'if(b&&f){b.style.position="static";b.style.marginLeft=f.querySelector(".link-portal")?"18px":"auto";f.appendChild(b);}})();<\/script>'
    + '<style>@media print{.no-imprimir{display:none!important}} @media (max-width:640px){.barra-sesion{padding:3px 7px!important;font-size:10.5px!important}.barra-sesion-nombre{display:none}header .brand-row{flex-wrap:wrap!important;row-gap:0!important}#barraSesion[style*="static"]{flex-basis:100%;text-align:right;margin-left:0!important;border:0!important;padding:0 0 6px!important}}</style>';
  const corte = html.lastIndexOf('</body>');
  html = corte >= 0 ? html.slice(0, corte) + barra + html.slice(corte) : html + barra;
  document.open();
  document.write(html);
  document.close();
}

// Pide la llave con la sesion ya iniciada. Devuelve false si hay que mostrar el formulario.
async function ingresarCon(token) {
  const r = await Acceso.rpc('ingresar', { p_pagina: CFG.pagina, p_kid: CFG.kid }, token);
  if (!r.ok || !r.datos) throw new Error('No se pudo validar el ingreso (' + r.estado + ')');
  if (r.datos.motivo === 'cambiar_clave') {
    await Acceso.pedirClaveNueva(token);
    return ingresarCon(token);
  }
  if (!r.datos.ok) {
    // Una pagina desactualizada no es motivo para cerrar la sesion.
    if (r.datos.motivo !== 'sin_llave') Acceso.salir();
    avisar(r.datos.motivo === 'inactivo' ? 'Tu usuario está desactivado. Habla con el administrador.'
      : r.datos.motivo === 'sin_llave' ? 'Esta página está desactualizada. Recárgala en unos minutos.'
      : 'Tu usuario no tiene acceso a esta página.');
    return false;
  }
  // Llego desde la administracion sin sesion: tras ingresar vuelve alla.
  if (r.datos.rol === 'admin' && new URLSearchParams(location.search).get('ir') === 'admin') {
    location.replace('admin.html' + location.hash);
    return true;
  }
  await abrirPagina(r.datos.llave, r.datos.nombre || r.datos.usuario, r.datos.rol);
  return true;
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  avisar('');
  ocupado(true);
  const usuario = Acceso.normalizarUsuario(document.getElementById('usuario').value);
  const clave = document.getElementById('clave').value;
  try {
    if (CFG.llavePrueba) { await abrirPagina(CFG.llavePrueba, usuario + ' (prueba)', usuario === 'admin' ? 'admin' : ''); return; }
    const token = await Acceso.entrar(usuario, clave, document.getElementById('mantener').checked);
    if (!token) {
      Acceso.rpc('registrar_fallo', { p_usuario: usuario, p_pagina: CFG.pagina }).catch(() => {});
      avisar('Usuario o clave incorrectos.');
    } else {
      await ingresarCon(token);
    }
  } catch (err) {
    avisar('No se pudo ingresar: ' + err.message + '. Revisa tu conexión e intenta de nuevo.');
  }
  ocupado(false);
});

(async () => {
  if (CFG.llavePrueba) { document.documentElement.className = ''; document.getElementById('avisoPrueba').style.display = 'block'; return; }
  try {
    ocupado(true);
    let token = await Acceso.retomar();
    if (token) {
      let abierta = false;
      try { abierta = await ingresarCon(token); } catch (err) {
        // El token guardado ya no sirve: se pide uno nuevo y se reintenta.
        token = await Acceso.retomar(true);
        if (token) abierta = await ingresarCon(token);
      }
      if (abierta) return;
    }
  } catch (err) { /* sin sesion valida: queda el formulario */ }
  document.documentElement.className = '';
  ocupado(false);
})();
