<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brecha a la meta RGU · Cobra</title>

<style>
  :root{
    --bg:#eef1f4; --panel:#ffffff; --panel-2:#f5f7f9; --border:#e0e5ea; --text:#22303f; --text-dim:#6b7a8c;
    --cobra-navy:#003c71; --cobra-blue:#0071ce; --celeste:#29a9e0;
    --ok:#1fa971; --ok-bg:#e2f6ee; --warn:#e2962e; --warn-bg:#fdf1e2; --bad:#e2523e; --bad-bg:#fce4e0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI', Arial, sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  .brand-row{ display:flex; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .brand-row img{ height:36px; }
  .brand-divider{ width:1px; height:28px; background:var(--border); }
  .eyebrow{ text-transform:uppercase; letter-spacing:.14em; font-size:12px; color:var(--celeste); font-weight:800; }
  .link-portal{ color:var(--cobra-blue); font-weight:700; font-size:13px; text-decoration:none; }
  .link-portal:hover{ text-decoration:underline; }
  header{ background:var(--panel); padding:22px 6vw; border-bottom:4px solid var(--celeste); }
  h1{ margin:0 0 6px; font-size:clamp(20px,4vw,26px); font-weight:800; color:var(--cobra-navy); }
  h2{ margin:22px 0 10px; font-size:15px; color:var(--cobra-navy); }
  .subtitle{ color:#3a4a5c; font-size:14px; line-height:1.5; max-width:780px; }
  main{ padding:20px 6vw 40px; margin:0 auto; }
  .filtros{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  select{ padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:#fff; color:var(--text); }
  .resumen{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .card .lbl{ font-size:12px; color:var(--text-dim); }
  .card .num{ font-size:26px; font-weight:800; color:var(--cobra-navy); margin-top:2px; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; }
  .t-tecnicos{ min-width:820px; }
  th{ text-align:left; font-size:12px; color:var(--text-dim); font-weight:700; padding:11px 12px; border-bottom:1px solid var(--border); background:var(--panel-2); white-space:nowrap; }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num-col{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .sub{ font-size:12px; color:var(--text-dim); }
  .barra-wrap{ display:flex; align-items:center; gap:8px; min-width:180px; }
  .barra{ position:relative; flex:1; height:9px; background:var(--panel-2); border-radius:5px; }
  .barra > b{ position:absolute; left:71.43%; top:-3px; width:2px; height:15px; background:var(--cobra-navy); }
  .barra > i{ display:block; height:9px; border-radius:5px; }
  .pill{ display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .ok{ background:var(--ok-bg); color:#12764e; } .warn{ background:var(--warn-bg); color:#8a5a12; } .bad{ background:var(--bad-bg); color:#a3301f; }
  .f-ok{ background:var(--ok); } .f-warn{ background:var(--warn); } .f-bad{ background:var(--bad); }
  button.ver{ border:1px solid var(--border); background:#fff; color:var(--cobra-blue); font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; cursor:pointer; }
  tr.detalle td{ background:var(--panel-2); padding:10px 12px 14px; }
  .ordenes{ display:flex; flex-wrap:wrap; gap:6px; }
  .ordenes span{ background:#fff; border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-size:12px; font-variant-numeric:tabular-nums; }
  .nota{ font-size:12px; color:var(--text-dim); line-height:1.6; margin-top:14px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<!-- Sistema de diseno de la Academia Tecnica: el generador incrusta aca reportes/estilo-academia.css -->
<style>/*__ESTILO_ACADEMIA__*/</style>
</head>
<body>
<header class="top">
  <div class="wrap brand-row">
    <img src="logo-cobra.png" alt="Cobra" id="logoCobra">
    <div class="brand-divider"></div>
    <div class="brand-name">Portal <strong>Supervisor</strong></div>
    <a class="link-portal" id="linkVolver" href="supervisor.html">&larr; Volver al dashboard</a>
  </div>
</header>
<section class="hero sin-foto" aria-label="Portada">
  <svg class="fibers" viewBox="0 0 1100 600" preserveAspectRatio="none" aria-hidden="true"><g class="strand"><path d="M-20 40 C339 12 744 101 1100 178"/><path d="M-20 76 C364 101 649 147 1100 187"/><path d="M-20 112 C389 130 694 193 1100 196"/><path d="M-20 148 C354 159 739 129 1100 205"/><path d="M-20 184 C379 188 644 175 1100 214"/><path d="M-20 220 C344 217 689 221 1100 223"/><path d="M-20 256 C369 246 734 157 1100 232"/><path d="M-20 292 C394 275 639 203 1100 241"/><path d="M-20 328 C359 304 684 249 1100 250"/><path d="M-20 364 C384 393 729 185 1100 259"/><path d="M-20 400 C349 422 634 231 1100 268"/><path d="M-20 436 C374 451 679 277 1100 277"/><path d="M-20 472 C339 480 724 213 1100 286"/><path d="M-20 508 C364 509 629 259 1100 295"/><path d="M-20 544 C389 538 674 305 1100 304"/><path d="M-20 580 C354 567 719 241 1100 313"/></g><path class="pulse p1" d="M-20 76 C364 101 649 147 1100 187"/><path class="pulse p2" d="M-20 184 C379 188 644 175 1100 214"/><path class="pulse p3" d="M-20 292 C394 275 639 203 1100 241"/><path class="pulse p4" d="M-20 400 C349 422 634 231 1100 268"/><path class="pulse p5" d="M-20 508 C364 509 629 259 1100 295"/></svg>
  <div class="wrap"><div>
    <p class="eyebrow">Cobra &middot; Producción</p>
    <h1>Brecha a la meta de <b>Producción RGU</b></h1>
    <p class="subtitle" id="subtitulo"></p>
  </div></div>
</section>
<main>
  <div class="filtros">
    <select id="filtroSupervisor" aria-label="Supervisor"></select>
    <select id="filtroEstado" aria-label="Estado">
      <option value="">Todos los estados</option>
      <option value="bad">Fuera de alcance</option>
      <option value="warn">Alcanzable</option>
      <option value="ok">Sobre la meta</option>
    </select>
  </div>
  <div class="resumen" id="resumen"></div>
  <div class="panel">
    <table class="t-tecnicos">
      <thead>
        <tr>
          <th>Técnico</th>
          <th>Avance contra su meta</th>
          <th class="num-col">RGU / días</th>
          <th class="num-col">Le faltan</th>
          <th class="num-col" id="thNecesita">Necesita por día</th>
          <th class="num-col">RGU proyectado</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
  <p class="nota" id="nota"></p>
</main>
<footer class="foot"><div class="wrap">
  <span class="by">Diseño y desarrollo <b>J.V.Soft...</b> &middot; <b>SMSI</b> &middot; Construyendo ideas</span>
</div></footer>
<script>
const DATA = __DATA_BRECHA_JSON__;
const ESTADOS = { ok: 'Sobre la meta', warn: 'Alcanzable', bad: 'Fuera de alcance' };
const cal = DATA.calendario;

function n(v, dec) {
  return v.toLocaleString('es-CL', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function titleCase(s) {
  return String(s || '').toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());
}

document.getElementById('subtitulo').textContent =
  'Avance del mes: ' + DATA.periodo + '. Días hábiles: ' + cal.transcurridos + ' de ' + cal.totales +
  (cal.restantes > 0 ? ' (queda' + (cal.restantes === 1 ? ' ' : 'n ') + cal.restantes + ').' : ' (mes cerrado).');
document.getElementById('thNecesita').textContent =
  cal.restantes > 0 ? 'Necesita por día (' + cal.restantes + ' día' + (cal.restantes === 1 ? '' : 's') + ')' : 'Necesita por día';

const selSup = document.getElementById('filtroSupervisor');
const supervisores = [...new Set(DATA.tecnicos.map((t) => t.supervisor).filter(Boolean))].sort();
selSup.innerHTML = '<option value="">Todos los supervisores</option>' +
  supervisores.map((s) => '<option value="' + esc(s) + '">' + esc(titleCase(s)) + '</option>').join('');

function render() {
  const sup = selSup.value;
  const est = document.getElementById('filtroEstado').value;
  const equipo = DATA.tecnicos.filter((t) => !sup || t.supervisor === sup);
  const lista = equipo.filter((t) => !est || t.estado === est)
    .sort((a, b) => (b.faltan - a.faltan) || (a.pct - b.pct));

  const bajo = equipo.filter((t) => t.pct < 100);
  const faltan = bajo.reduce((s, t) => s + t.faltan, 0);
  const alcanzables = equipo.filter((t) => t.estado === 'warn').length;
  const card = (lbl, num) => '<div class="card"><div class="lbl">' + lbl + '</div><div class="num">' + num + '</div></div>';
  document.getElementById('resumen').innerHTML =
    card('Bajo la meta', bajo.length + ' de ' + equipo.length) +
    card('RGU que faltan al equipo', n(faltan, 1)) +
    card('Aún pueden llegar', alcanzables) +
    card('Días hábiles restantes', cal.restantes);

  document.getElementById('filas').innerHTML = lista.map((t) => {
    const ancho = Math.min(t.pct, 140) / 140 * 100;
    return '<tr>' +
      '<td><div>' + esc(titleCase(t.nombre)) + '</div><div class="sub">' + esc(titleCase(t.agencia)) + ' · meta ' + n(t.metaDiaria, 1) + ' por día</div></td>' +
      '<td><div class="barra-wrap"><div class="barra"><i class="f-' + t.estado + '" style="width:' + ancho.toFixed(1) + '%"></i><b></b></div><span class="num-col" style="min-width:58px">' + n(t.pct, 1) + ' %</span></div></td>' +
      '<td class="num-col">' + n(t.rgu, 2) + ' / ' + t.dias + '</td>' +
      '<td class="num-col">' + (t.faltan > 0 ? n(t.faltan, 1) + ' RGU' : '—') + '</td>' +
      '<td class="num-col">' + (t.necesitaPorDia != null && t.necesitaPorDia > 0 ? n(t.necesitaPorDia, 1) + ' RGU' : '—') + '</td>' +
      '<td class="num-col">' + (t.rguProyectado != null ? n(t.rguProyectado, 1) : '—') + '</td>' +
      '<td><span class="pill ' + t.estado + '">' + ESTADOS[t.estado] + '</span></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="7" class="sub" style="text-align:center; padding:24px;">Ningún técnico con ese filtro.</td></tr>';
}

document.getElementById('nota').innerHTML =
  '<b>Le faltan:</b> RGU que le faltan para estar en 100 % con los días que ya trabajó (meta diaria × días trabajados − RGU completada). ' +
  '<b>Necesita por día:</b> RGU diarios para cerrar el mes en 100 %, suponiendo que trabaja todos los días hábiles que quedan. ' +
  '<b>Alcanzable:</b> necesita hasta ' + DATA.rguDiarioAlcanzable + ' RGU por día. ' +
  '<b>RGU proyectado:</b> RGU ÷ días hábiles transcurridos × días hábiles del mes, igual que el Excel de producción. ' +
  'La línea azul de la barra marca el 100 %. Domingos y feriados  no cuentan como días hábiles; el sábado cuenta completo. ' +
  'Datos del portal generado el ' + esc(DATA.generadoEl) + '.';

// Supervisor que venia seleccionado en el dashboard (brecha.html?supervisor=...)
const supUrl = new URLSearchParams(location.search).get('supervisor');
if (supUrl && supervisores.includes(supUrl)) selSup.value = supUrl;
function actualizarLinkVolver() {
  document.getElementById('linkVolver').href = 'supervisor.html' + (selSup.value ? '?supervisor=' + encodeURIComponent(selSup.value) : '');
}
selSup.addEventListener('change', () => { render(); actualizarLinkVolver(); });
actualizarLinkVolver();
document.getElementById('filtroEstado').addEventListener('change', render);
render();
// ---------- Animacion de las cifras del resumen ----------
// Al cargar la pagina, las cifras grandes suben desde 0 hasta su valor. Sirve
// para cualquier texto con numeros ("75,5 %", "12 de 49"): cada numero se
// anima por separado y conserva sus decimales. No se anima si el usuario pidio
// reducir el movimiento en su sistema.
function animarCifras(contenedor, duracion) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const patron = /\d+(?:[.,]\d+)?/g;
  const cifras = [...contenedor.querySelectorAll('.num')].map((el) => ({ el, final: el.textContent }));
  if (!cifras.length || !window.requestAnimationFrame) return;
  const inicio = performance.now();
  function paso(ahora) {
    const t = Math.min(1, (ahora - inicio) / duracion);
    const avance = 1 - Math.pow(1 - t, 3); // parte rapido y frena al llegar
    for (const c of cifras) {
      c.el.textContent = t === 1 ? c.final : c.final.replace(patron, (n) => {
        const coma = n.includes(',');
        const decimales = (n.split(/[.,]/)[1] || '').length;
        const valor = (parseFloat(n.replace(',', '.')) * avance).toFixed(decimales);
        return coma ? valor.replace('.', ',') : valor;
      });
    }
    if (t < 1) requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}

// ---------- Animaciones al desplazarse ----------
// Cada bloque aparece cuando entra en pantalla, y alVer() corre una funcion
// la primera vez que un elemento se ve (cifras que suben, lineas que se
// dibujan). Si el navegador no lo soporta o el usuario pidio reducir el
// movimiento, todo se muestra de inmediato: nada queda oculto.
const SIN_MOVIMIENTO = !('IntersectionObserver' in window) || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function alVer(el, fn) {
  if (!el) return;
  if (SIN_MOVIMIENTO) { fn(el); return; }
  const o = new IntersectionObserver((entradas) => {
    if (entradas.some((e) => e.isIntersecting)) { o.disconnect(); fn(el); }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  o.observe(el);
}
function aparecerAlBajar() {
  if (SIN_MOVIMIENTO) return;
  const estilo = document.createElement('style');
  estilo.textContent = '.rv{opacity:0;transform:translateY(22px);}'
    // La transicion va solo en el estado final: asi el bloque no se desvanece al ocultarlo.
    + '.rv.rv-ver{opacity:1;transform:none;transition:opacity .95s ease,transform .95s cubic-bezier(.2,.7,.2,1);}'
    + '.comb-dibujar{animation-play-state:paused;}.en-vista .comb-dibujar{animation-play-state:running;}'
    // Barras: parten vacias y se llenan de izquierda a derecha cuando su bloque entra en pantalla.
    + ':is(.pareto-barra,.barra .b,.barra > i){transform-origin:left center;}'
    + '.rv:not(.rv-ver) :is(.pareto-barra,.barra .b,.barra > i){transform:scaleX(0);}'
    + '.rv-ver :is(.pareto-barra,.barra .b,.barra > i){transition:transform 1.7s cubic-bezier(.2,.7,.2,1) .3s;}'
    + [1, 2, 3, 4, 5, 6, 7, 8].map((n) => '.rv-ver .pareto-fila:nth-child(' + n + ') .pareto-barra{transition-delay:' + (0.25 + n * 0.12).toFixed(2) + 's;}').join('')
    + '.rv:not(.rv-ver) .barra-segmentada{clip-path:inset(0 100% 0 0);}'
    + '.rv-ver .barra-segmentada{clip-path:inset(0 0 0 0);transition:clip-path 1.7s cubic-bezier(.2,.7,.2,1) .3s;}'
    + '@media print{.rv{opacity:1!important;transform:none!important;}}';
  document.head.appendChild(estilo);
  // En las filas de tarjetas entra cada tarjeta, una tras otra; el resto entra como bloque.
  const FILAS = '.resumen-row, .ranking-row, .fila-doble, .grid2, .resumen';
  document.querySelectorAll('main > *').forEach((bloque) => {
    const piezas = bloque.matches(FILAS) && bloque.children.length ? Array.from(bloque.children) : [bloque];
    piezas.forEach((el, i) => {
      el.classList.add('rv');
      el.style.transitionDelay = (piezas.length > 1 ? Math.min(i, 5) * 120 : 0) + 'ms';
      alVer(el, () => {
        el.classList.add('rv-ver');
        // Al terminar se quita el retardo, para no frenar otros efectos del bloque.
        setTimeout(() => { el.style.transitionDelay = ''; }, 1900);
      });
    });
  });
}
alVer(document.getElementById('resumen'), () => animarCifras(document.getElementById('resumen'), 1400));
aparecerAlBajar();
</script>
</body>
